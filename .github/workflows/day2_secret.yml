name: day2-secret
on: workflow_dispatch
jobs:
  leak:
    runs-on: ubuntu-latest
    steps:
      - name: direct echo (masked)
        run: echo "${{ secrets.DEMO_SECRET }}"
      - name: transformed echo (NOT masked)
        run: echo "${{ secrets.DEMO_SECRET }}" | base64
      - name: safer pattern
        env:
          TOKEN: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "length is ${#TOKEN}"
          ENC=$(echo "$TOKEN" | base64)
          echo "::add-mask::$ENC"
          echo "encoded is $ENC"