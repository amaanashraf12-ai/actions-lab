name: GH-200 Event Triggers Master Test

on:
  # 1. Scheduled Cron (Runs every hour on default branch only - UTC)
  schedule:
    - cron: '0 * * * *'

  # 2. Push with branch, tag, and path filtering
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v[0-9].*'    # Matches tags like v1.0, v2.1
    paths:
      - 'src/**'       # Triggers ONLY if files in /src change
      - '!src/docs/**' # Ignores changes in /src/docs

  # 3. Pull Request with explicit activity types
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

  # 4. Manual UI/CLI trigger with inputs
  workflow_dispatch:
    inputs:
      test_reason:
        type: string
        description: 'Reason for manual test'
        required: true
        default: 'Manual GH-200 verification'

  # 5. External API trigger (Repository Dispatch)
  repository_dispatch:
    types: [custom_app_event]

  # 6. Webhook issue event with activity type
  issues:
    types: [opened]

jobs:
  verify-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Print Trigger Metadata
        run: |
          echo "========================================="
          echo "Trigger Event Name: ${{ github.event_name }}"
          echo "Ref / Branch: ${{ github.ref }}"
          echo "Actor / User: ${{ github.actor }}"
          echo "========================================="

      - name: Process Repository Dispatch Payload
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          echo "Custom Event Type: ${{ github.event.action }}"
          echo "Payload Data: ${{ github.event.client_payload.message }}"

      - name: Process Issue Trigger Data
        if: ${{ github.event_name == 'issues' }}
        run: |
          echo "Issue Title: ${{ github.event.issue.title }}"
          echo "Issue URL: ${{ github.event.issue.html_url }}"