name: day2-parse
on: workflow_dispatch
jobs:
  empty:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "${{ lower(github.actor) }}"
          echo "missing var=[${{ vars.DOES_NOT_EXIST }}]"
          echo "missing input=[${{ inputs.nothing }}]"
          echo "missing field=[${{ github.not_a_field }}]"
  skipped:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "never runs on a manual trigger"