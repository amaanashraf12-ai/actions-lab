name: day2-matrix
on: workflow_dispatch
jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest]
        version: [1, 2, 3]
        include:
          - os: windows-latest
            version: 3
    steps:
      - run: echo "os=${{ matrix.os }} version=${{ matrix.version }} experimental=${{ matrix.experimental }}"
      - if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.version == 2) }}
        run: sleep 40
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.version == 2 }}
        run: exit 1
